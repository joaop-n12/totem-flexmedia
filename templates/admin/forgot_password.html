<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redefinir Senha · FlexMedia Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
<div class="login-page">
  <div class="login-box">
    <div class="login-logo">Flex<span>Media</span></div>
    <p class="login-tagline">Redefinição de senha</p>
    <div class="login-error" style="background:var(--a-card);border-color:var(--a-border);color:var(--a-text);text-align:center;line-height:1.6;">
      Para redefinir sua senha, entre em contato com o suporte FlexMedia.<br>
      <strong>suporte@flexmedia.com.br</strong>
    </div>
    <p style="text-align:center;margin-top:16px;font-size:13px;">
      <a href="{{ url_for('auth.login') }}" style="color:var(--a-muted);">← Voltar ao login</a>
    </p>
  </div>
</div>
</body>
</html>
