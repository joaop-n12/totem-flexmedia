{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <div class="page-eyebrow">🧬 Catálogo</div>
  <h2 class="page-title">Espécies</h2>
  <p class="page-desc">Escolha uma espécie para ver os animais</p>
</div>

<div class="grid species-grid">
  {% for e in especies %}
  <a class="card species-card" href="{{ url_for('zoo.animais_lista', slug=institution.slug, especie_slug=e.slug) }}">
    <div class="species-thumb">
      <img src="{{ url_for('static', filename='images/' ~ e.imagem) }}" alt="{{ e.nome }}" loading="lazy">
    </div>
    <div class="card-body">
      <h3 class="card-title">{{ e.nome }}</h3>
      <p class="card-meta">📌 {{ e.count }} {{ 'animal' if e.count == 1 else 'animais' }}</p>
      <p class="card-desc">Toque para explorar</p>
    </div>
  </a>
  {% endfor %}
</div>

<div class="page-actions">
  <a class="btn" href="{{ url_for('zoo.catalogo', slug=institution.slug) }}">📋 Ver Catálogo Completo</a>
</div>
{% endblock %}
